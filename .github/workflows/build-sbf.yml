name: Build Solana Program (SBF)

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/solana/safetx-program/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/solana/safetx-program/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/solana/safetx-program/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Pull Solana Docker image
        run: |
          docker pull solanalabs/solana:stable

      - name: Build program inside Docker (SBF)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$HOME/.cargo":/root/.cargo \
            -w /work/contracts/solana/safetx-program \
            solanalabs/solana:stable \
            bash -lc "cargo build-sbf"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: safetx_program.so
          path: contracts/solana/safetx-program/target/sbf-solana-solana/release/safetx_program.so
