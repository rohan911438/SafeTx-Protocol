name: Build Solana Program (SBF)

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/solana/safetx-program/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Solana Docker image
        run: |
          docker pull solanalabs/solana:stable

      - name: Build program inside Docker (SBF)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/contracts/solana/safetx-program \
            solanalabs/solana:stable \
            bash -lc "cargo build-sbf"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: safetx_program.so
          path: contracts/solana/safetx-program/target/sbf-solana-solana/release/safetx_program.so
