name: Build Solana Program (SBF)

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/solana/safetx-program/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Build program (SBF)
        working-directory: contracts/solana/safetx-program
        run: |
          cargo build-sbf

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: safetx_program.so
          path: contracts/solana/safetx-program/target/sbf-solana-solana/release/safetx_program.so
